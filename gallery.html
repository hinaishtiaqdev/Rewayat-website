<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#000;
overflow-x:hidden;
}

/*================ NAVBAR =================*/

.navbar{
position:fixed;
top:0;
left:0;
width:100%;
background:rgba(0,0,0,.75);
backdrop-filter:blur(8px);
padding:18px 0;
z-index:9999;
}

.logo{
width:75px;
}

.brand-name{
color:#fff;
font-size:24px;
font-weight:700;
margin-left:10px;
}

.menu{
display:flex;
justify-content:center;
align-items:center;
list-style:none;
gap:35px;
margin:0;
padding:0;
}

.menu a{
text-decoration:none;
color:#fff;
font-size:17px;
transition:.4s;
}

.menu a:hover{
color:#cda45e;
}

.book-btn{
display:flex;
justify-content:center;
align-items:center;
width:110px;
height:42px;
border:2px solid #cda45e;
border-radius:30px;
text-decoration:none;
color:#fff;
transition:.4s;
}

.book-btn:hover{
background:#cda45e;
color:#000;
}

/*================ BANNER =================*/

.page-banner{

height:55vh;
margin-top:85px;
background:url("images/hero.jpeg") center/cover;
display:flex;
justify-content:center;
align-items:center;
position:relative;

}

.page-banner::before{

content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,.65);

}

.page-banner .content{

position:relative;
z-index:2;
text-align:center;

}

.page-banner h1{

font-size:60px;
color:#fff;
font-weight:700;

}

.page-banner span{

color:#cda45e;

}

.page-banner p{

color:#ddd;
margin-top:10px;

}

/*================ GALLERY =================*/

.gallery{

padding:80px 0;
background:#0c0b09;

}

.section-title{

text-align:center;
margin-bottom:50px;

}

.section-title h5{

color:#cda45e;
letter-spacing:2px;
font-size:16px;

}

.section-title h2{

color:#fff;
font-size:42px;
font-weight:700;
margin-top:10px;

}

.gallery-item{

overflow:hidden;
border-radius:10px;
margin-bottom:25px;

}

.gallery-item img{

width:100%;
height:280px;
object-fit:cover;
border-radius:10px;
transition:.5s;

}

.gallery-item:hover img{

transform:scale(1.1);

}

/*================ FOOTER =================*/

.footer{

background:#000;
padding:45px 0;
text-align:center;

}

.footer hr{

border-color:#333;
margin:30px 0;

}

.social-icons{

margin-bottom:20px;

}

.social-icons a{

display:inline-flex;
justify-content:center;
align-items:center;
width:50px;
height:50px;
border:1px solid #555;
border-radius:50%;
margin:0 8px;
text-decoration:none;
color:#fff;
font-size:20px;
transition:.4s;

}

.social-icons a:hover{

background:#cda45e;
border-color:#cda45e;
color:#000;

}

.footer p{

color:#bbb;
margin:8px 0;

}

.footer span{

color:#cda45e;

}

/* CART BADGE */

.cart-link{

position:relative;

}


#cart-count{

background:#cda45e;
color:#000;
font-size:12px;
font-weight:700;

width:22px;
height:22px;

display:flex;
justify-content:center;
align-items:center;

border-radius:50%;

margin-left:5px;

}

</style>
