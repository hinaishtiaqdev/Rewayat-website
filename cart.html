<script>

/* ================= ADD TO CART (Java Script)================= */

let cart = JSON.parse(localStorage.getItem("cart")) || [];


/* Add Cart Buttons */

let addButtons = document.querySelectorAll(".add-cart");


addButtons.forEach(button => {

    button.addEventListener("click", function(){

        let name = this.getAttribute("data-name");

        let price = Number(this.getAttribute("data-price"));


        let existingItem = cart.find(item => item.name === name);


        if(existingItem){

            existingItem.quantity++;

        }

        else{

            cart.push({

                name:name,
                price:price,
                quantity:1

            });

        }


        localStorage.setItem("cart", JSON.stringify(cart));


        alert(name + " Added To Cart");

    });

});



/* ================= SHOW CART ================= */


let cartContainer = document.getElementById("cart-items");


if(cartContainer){


displayCart();


}



function displayCart(){


cartContainer.innerHTML="";


let total = 0;



cart.forEach((item,index)=>{


let itemTotal = item.price * item.quantity;


total += itemTotal;



cartContainer.innerHTML += `


<tr>


<td>${item.name}</td>


<td>Rs. ${item.price}</td>


<td>


<button class="qty-btn" onclick="changeQty(${index},-1)">
-
</button>


<span class="qty">

${item.quantity}

</span>


<button class="qty-btn" onclick="changeQty(${index},1)">
+
</button>


</td>


<td>

Rs. ${itemTotal}

</td>



<td>

<button class="remove-btn" onclick="removeItem(${index})">

Remove

</button>

</td>


</tr>


`;


});



document.getElementById("grand-total").innerHTML =
"Rs. " + total;


}




/* ================= QUANTITY ================= */


function changeQty(index,value){


cart[index].quantity += value;



if(cart[index].quantity <=0){

cart.splice(index,1);

}



localStorage.setItem("cart",JSON.stringify(cart));


displayCart();


}




/* ================= REMOVE ================= */


function removeItem(index){


cart.splice(index,1);



localStorage.setItem("cart",JSON.stringify(cart));


displayCart();


}




</script>
