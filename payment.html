body{

/*================ NAVBAR =================*/


.navbar{

position:fixed;
top:0;
left:0;
width:100%;
padding:18px 0;

backdrop-filter:blur(8px);
z-index:9999;

}


.logo{

width:75px;

}


.brand-name{

color:#fff;
font-size:24px;
font-weight:700;

}



.menu{

display:flex;
justify-content:center;
align-items:center;
gap:35px;
list-style:none;
margin:0;
padding:0;

}



.menu a{

color:#fff;
text-decoration:none;
font-size:17px;
transition:.4s;

}



.menu a:hover{

color:#cda45e;

}



.book-btn{

display:flex;
justify-content:center;
align-items:center;
height:38px;
padding:0 12px;
border:2px solid #cda45e;
border-radius:30px;
color:#fff;
text-decoration:none;
font-size:14px;
white-space:nowrap;
transition:.4s;

}



.book-btn:hover{

background:#cda45e;
color:#000;

}



/*================ BANNER =================*/


.page-banner{

height:45vh;
margin-top:85px;
background:url("images/hero.jpeg") center/cover;
display:flex;
justify-content:center;
align-items:center;
position:relative;

}



.page-banner::before{

content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,.65);

}



.page-banner .content{

position:relative;
z-index:2;
text-align:center;

}



.page-banner h1{

color:#fff;
font-size:55px;
font-weight:700;

}



.page-banner span{

color:#cda45e;

}



.page-banner p{

color:#ddd;

}

/*================ PAYMENT SECTION =================*/

.payment-section{

padding:80px 0;
background:#0c0b09;

}


.section-title{

text-align:center;
margin-bottom:50px;

}


.section-title h5{

color:#cda45e;
letter-spacing:2px;
font-size:16px;

}


.section-title h2{

color:#fff;
font-size:42px;
font-weight:700;

}


/*================ FORM BOX =================*/


.payment-box{

background:#1a1814;
padding:35px;
border-radius:10px;
height:100%;

}


.payment-box h3{

color:#fff;
margin-bottom:25px;
font-size:25px;

}


.payment-box input,
.payment-box textarea,
.payment-box select{

width:100%;
padding:14px;
margin-bottom:20px;
background:#0c0b09;
border:1px solid #333;
border-radius:5px;
color:#fff;
outline:none;

}


.payment-box input::placeholder,
.payment-box textarea::placeholder{

color:#aaa;

}


.payment-box textarea{

height:120px;
resize:none;

}



/*================ PAYMENT METHOD =================*/


.payment-method{

color:#fff;
margin-bottom:25px;

}


.payment-method label{

display:block;
margin:12px 0;
cursor:pointer;

}


.payment-method input{

width:auto;
margin-right:10px;

}



/*================ ORDER SUMMARY =================*/


.order-summary{

background:#1a1814;
padding:35px;
border-radius:10px;

}


.order-summary h3{

color:#fff;
margin-bottom:25px;

}


.order-item{

display:flex;
justify-content:space-between;
color:#ccc;
padding:12px 0;
border-bottom:1px solid #333;

}


.order-total{

display:flex;
justify-content:space-between;
color:#cda45e;
font-size:22px;
font-weight:700;
margin-top:25px;

}



/*================ PLACE ORDER BUTTON =================*/


.place-order{

display:block;
width:100%;
padding:13px;
background:#cda45e;
color:#fff;
border:none;
border-radius:30px;
margin-top:30px;
font-size:17px;
font-weight:600;
transition:.4s;

}


.place-order:hover{

background:#b68d4c;
color:#000;

}


/*================ FOOTER =================*/


.footer{

background:#000;
padding:45px 0;
text-align:center;

}


.social-icons{

margin-bottom:20px;

}


.social-icons a{

display:inline-flex;
justify-content:center;
align-items:center;
width:50px;
height:50px;
border:1px solid #555;
border-radius:50%;
margin:0 8px;
color:#fff;

.social-icons a:hover{

.footer hr{

.footer p{

<div class="row">



<!-- CUSTOMER FORM -->


<div class="col-lg-7">


<div class="payment-box">


<h3>

</h3>



<form>


<div class="row">


<div class="col-md-6">

<input type="tel" placeholder="Phone Number">

<script>


// Get Cart Data

let paymentCart = JSON.parse(localStorage.getItem("cart")) || [];



let paymentItems = document.getElementById("payment-items");

let paymentTotal = document.getElementById("payment-total");



let totalAmount = 0;



// Show Order Summary


paymentCart.forEach((item)=>{


let itemTotal = item.price * item.quantity;


totalAmount += itemTotal;



paymentItems.innerHTML += `

<div class="order-item">

<span>

${item.name} x ${item.quantity}

</span>


<span>

Rs. ${itemTotal}

</span>


</div>

`;



});



// Show Total


paymentTotal.innerHTML = "Rs. " + totalAmount;





// Place Order Function


function placeOrder(){



let inputs = document.querySelectorAll(
".payment-box input[type='text'], .payment-box input[type='email'], .payment-box input[type='tel']"
);



let empty = false;



inputs.forEach(input=>{


if(input.value.trim()==""){

empty=true;

}


});




if(empty){


alert("Please Fill All Required Fields");


return;


}




// Empty Cart


localStorage.removeItem("cart");



// Redirect


window.location.href="success.html";



}



</script>
